name: Build Dvinesoul Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.37" packaging toml

      - name: Prepare patched python-for-android
        run: |
          git clone https://github.com/kivy/python-for-android.git .github/p4a
          git -C .github/p4a checkout 58d21141f17c889bf8585f5665921d72028f8831
          P4A_DIR=.github/p4a python patch_p4a.py

      - name: Verify patched dependency handling
        run: |
          python -m py_compile .github/p4a/pythonforandroid/pythonpackage.py
          python -c "import sys; sys.path.insert(0,'.github/p4a'); from pythonforandroid.pythonpackage import get_package_dependencies; deps=get_package_dependencies('yt-dlp'); print('\\n'.join(sorted(deps))); assert not any('charset-normalizer' in d for d in deps), 'charset-normalizer unexpectedly present'"

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dvinesoul-Downloader-APK
          path: bin/*.apk
